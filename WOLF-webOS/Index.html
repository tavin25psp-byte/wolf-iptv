<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>WOLF IPTV</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- FUNDO -->
    <div id="background"></div>
    <div id="backgroundOverlay"></div>

    <!-- APLICAÇÃO -->
    <div id="app">

        <!-- TOPO -->
        <header id="topbar">

            <button
                id="menuButton"
                class="focusable top-menu-button"
                type="button"
            >
                ☰ &nbsp; WOLF MENU
            </button>

            <div id="pageTitle">
                WOLF IPTV
            </div>

        </header>

        <!-- CONTEÚDO -->
        <main id="contentScroll">

            <div id="content">

                <div id="loading" class="loading">

                    <div class="loadingWolf">
                        WOLF
                    </div>

                    <div>
                        Carregando catálogo...
                    </div>

                </div>

            </div>

        </main>

    </div>

    <!-- MENU LATERAL -->
    <aside id="sideMenu" aria-hidden="true">

        <div id="menuHeader">

            <div id="menuTitle">
                WOLF MENU
            </div>

            <button
                id="closeMenu"
                class="focusable"
                type="button"
            >
                ✕
            </button>

        </div>

        <div id="menuScroll">

            <div id="menuContent"></div>

        </div>

    </aside>
