<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WOLF IPTV</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d0f17;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
      user-select: none;
    }

    /* Tela de Loading */
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0d0f17;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .spinner {
      width: 60px;
      height: 60px;
      border: 6px solid #1f2438;
      border-top: 6px solid #e00000;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Cabeçalho */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
      background: #141724;
      border-bottom: 3px solid #e00000;
    }

    .logo {
      font-size: 30px;
      font-weight: 900;
      color: #e00000;
      letter-spacing: 3px;
    }

    nav {
      display: flex;
      gap: 15px;
    }

    .nav-btn {
      background: #1f2438;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .nav-btn:focus, .nav-btn.active-tab {
      background: #e00000;
      outline: 3px solid #ffffff;
    }

    /* Secção de Conteúdo */
    .catalog-container {
      padding: 30px 40px;
    }

    .section-title {
      font-size: 22px;
      margin-bottom: 15px;
      color: #e00000;
      border-left: 4px solid #e00000;
      padding-left: 10px;
    }

    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 22px;
      margin-bottom: 40px;
    }

    /* Cards de Filmes e Séries */
    .card {
      background: #181c2b;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: transform 0.2s ease, outline 0.2s ease;
      cursor: pointer;
    }

    .card:focus {
      outline: 4px solid #e00000;
      transform: scale(1.08);
      z-index: 10;
    }

    .card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      background: #141724;
    }

    .card-info {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card-title {
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-meta {
      font-size: 12px;
      color: #8a8f9d;
    }
  </style>
</head>
<body>

  <!-- Tela de Carregamento -->
  <div id="loading">
    <div class="spinner"></div>
    <h1 style="color: #ffffff; letter-spacing: 2px;">WOLF IPTV</h1>
    <p id="loading-status" style="color: #8a8f9d; margin-top: 10px; font-size: 16px;">Carregando catálogo...</p>
  </div>

  <!-- Cabeçalho -->
  <header>
    <div class="logo">WOLF IPTV</div>
    <nav>
      <button class="nav-btn active-tab" tabindex="0" onclick="filterCatalog('todos')">Todos</button>
      <button class="nav-btn" tabindex="0" onclick="filterCatalog('filmes')">Filmes</button>
      <button class="nav-btn" tabindex="0" onclick="filterCatalog('series')">Séries</button>
    </nav>
  </header>

  <!-- Container do Catálogo -->
  <main class="catalog-container">
    <h2 class="section-title" id="catalog-title">Catálogo Completo</h2>
    <div id="catalog" class="catalog-grid"></div>
  </main>

  <script>
    const FILMES_URL = "https://raw.githubusercontent.com/25psp-byte/wolf-webOS/main/catalogo.json";
    const SERIES_URL = "https://raw.githubusercontent.com/25psp-byte/wolf-webOS/main/series.json";

    let allItems = [];

    document.addEventListener("DOMContentLoaded", () => {
      loadData();
    });

    async function loadData() {
      const statusText = document.getElementById("loading-status");
      
      try {
        statusText.innerText = "Buscando filmes e séries...";

        const [resFilmes, resSeries] = await Promise.allSettled([
          fetch(FILMES_URL).then(r => r.ok ? r.json() : []),
          fetch(SERIES_URL).then(r => r.ok ? r.json() : [])
        ]);

        const filmes = resFilmes.status === "fulfilled" ? resFilmes.value : [];
        const series = resSeries.status === "fulfilled" ? resSeries.value : [];

        // Identifica e une filmes e séries
        const filmesFormatados = (Array.isArray(filmes) ? filmes : []).map(item => ({ ...item, tipo: 'filme' }));
        const seriesFormatadas = (Array.isArray(series) ? series : []).map(item => ({ ...item, tipo: 'serie' }));

        allItems = [...filmesFormatados, ...seriesFormatadas];

        if (allItems.length === 0) {
          throw new Error("Nenhum item encontrado no repositório.");
        }

        renderCatalog(allItems);
        
        // Esconde a tela de carregamento
        document.getElementById("loading").style.display = "none";

        // Foca no primeiro botão do menu para controlo remoto
        const firstBtn = document.querySelector(".nav-btn");
        if (firstBtn) firstBtn.focus();

      } catch (error) {
        console.error("Erro ao carregar dados:", error);
        statusText.innerText = "Erro ao carregar o catálogo. Verifique os arquivos JSON no GitHub.";
      }
    }

    function renderCatalog(items) {
      const container = document.getElementById("catalog");
      container.innerHTML = "";

      items.forEach((item) => {
        const card = document.createElement("div");
        card.className = "card";
        card.setAttribute("tabindex", "0");

        const titulo = item.titulo || item.nome || item.title || "Sem título";
        const imagem = item.poster || item.capa || item.image || item.img || "";
        const categoria = item.categoria || item.genero || (item.tipo === 'serie' ? 'Série' : 'Filme');
        const ano = item.ano || item.year || "";

        card.innerHTML = `
          <img src="${imagem}" alt="${titulo}" onerror="this.onerror=null;this.src='https://via.placeholder.com/170x250/141724/FFFFFF?text=WOLF+IPTV';">
          <div class="card-info">
            <div class="card-title">${titulo}</div>
            <div class="card-meta">${ano ? ano + ' • ' : ''}${categoria}</div>
          </div>
        `;

        // Evento de clique / Botão OK do controlo remoto
        card.addEventListener("click", () => {
          if (item.url || item.stream || item.link) {
            window.location.href = item.url || item.stream || item.link;
          } else {
            alert("Link de reprodução indisponível para: " + titulo);
          }
        });

        card.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.keyCode === 13) {
            card.click();
          }
        });

        container.appendChild(card);
      });
    }

    function filterCatalog(type) {
      const title = document.getElementById("catalog-title");
      const buttons = document.querySelectorAll(".nav-btn");

      buttons.forEach(btn => btn.classList.remove("active-tab"));
      event.target.classList.add("active-tab");

      if (type === "filmes") {
        title.innerText = "Filmes";
        renderCatalog(allItems.filter(i => i.tipo === "filme"));
      } else if (type === "series") {
        title.innerText = "Séries";
        renderCatalog(allItems.filter(i => i.tipo === "serie"));
      } else {
        title.innerText = "Catálogo Completo";
        renderCatalog(allItems);
      }
    }
  </script>
</body>
</html>
