:root{--cols:5;--hh:18rem}
@media (max-width:599px){:root{--hh:14rem}}
#grad{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;background:linear-gradient(180deg,rgba(5,7,18,0) 0%,rgba(5,7,18,.275) 50%,rgba(4,6,16,.745) 100%)}
/* cabecalho: logo + botao menu a esquerda, relogio a direita */
#top{position:absolute;left:2rem;right:2rem;top:1.2rem;display:flex;align-items:flex-start}
#hl{flex:none;display:flex;flex-direction:column;align-items:flex-start}
#logoTop{display:block;width:10.4rem;height:10.4rem;object-fit:contain}
.btn{display:inline-block;box-sizing:border-box;padding:.9rem 2rem;border-radius:1.4rem;background:rgba(8,12,28,.88);border:.1rem solid #2c3e78;font-weight:bold;font-size:1.8rem;cursor:pointer;white-space:nowrap;text-align:center}
.btn.foco{background:rgba(10,14,32,.96);border-color:#ff2828;box-shadow:inset 0 0 0 .2rem #ff2828}
#bMenu{display:flex;align-items:center;justify-content:center;width:23.5rem;height:5.8rem;margin-top:.6rem;padding:0;font-size:2rem}
#sbar{display:none;flex:1;min-width:0;align-items:center;align-self:flex-start;margin:11rem 1.5rem 0 1.5rem;height:5.8rem}
#q{flex:1;min-width:0;box-sizing:border-box;height:5.8rem;padding:0 2rem;font-size:2rem;color:#fff;background:rgba(8,12,28,.88);border:.1rem solid #2c3e78;border-radius:1.4rem;outline:none;margin-right:1rem;font-family:inherit}
#q:focus,#q.foco{border-color:#ff2828;box-shadow:inset 0 0 0 .2rem #ff2828}
#mic{display:flex;align-items:center;justify-content:center;width:5.8rem;height:5.8rem;padding:0;font-size:2.2rem}
#rel{margin-left:auto;flex:none;margin-top:.8rem;padding:0 .6rem 0 1.4rem;text-align:right}
#relH{font-size:2.4rem;font-weight:bold;line-height:1.2}
#relD{font-size:1.3rem;color:#c8c8d2;line-height:1.3}
@media (max-width:599px){
#logoTop{width:7.6rem;height:7.6rem}
#bMenu{width:15rem;height:4.6rem;font-size:1.5rem}
#sbar{margin-top:8.2rem;height:4.6rem}
#q{height:4.6rem;font-size:1.6rem}
#mic{width:4.6rem;height:4.6rem}
}
/* conteudo */
#main{position:absolute;left:2rem;right:2rem;top:var(--hh);bottom:1.2rem;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
#main::-webkit-scrollbar,#dlist::-webkit-scrollbar,#detInfo::-webkit-scrollbar{display:none}
#grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));column-gap:.8rem;row-gap:1.2rem;padding:0 .4rem 4rem .4rem}
.vazio{grid-column:1/-1;font-size:2rem;text-align:center;padding:4rem 2rem;color:#fff}
.sect{grid-column:1/-1;display:flex;align-items:center;padding:.8rem}
.sect i{flex:none;width:.4rem;height:2.2rem;background:#ff2828;margin-right:1rem}
.sect b{font-size:1.8rem;letter-spacing:.04em}
.sect.cz b{color:#aaa}
.sect.plano{padding:1.4rem 0}
.sect.plano b{font-size:2.2rem;letter-spacing:0}
.card{position:relative;box-sizing:border-box;height:33.5rem;border-radius:1.4rem;overflow:hidden;background:rgba(8,12,28,.88);border:.1rem solid #2c3e78;cursor:pointer}
.card.foco{background:rgba(10,14,32,.96)}
.card img{display:block;width:100%;height:27.5rem;object-fit:contain;image-rendering:-webkit-optimize-contrast;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.card .brd{display:none;position:absolute;left:0;top:0;right:0;bottom:0;box-sizing:border-box;border:.3rem solid #ff2828;border-radius:1.4rem;pointer-events:none}
.card.foco .brd{display:block}
.rod{position:absolute;left:0;right:0;bottom:0;height:6rem;box-sizing:border-box;padding:.3rem .8rem;display:flex;flex-direction:column;justify-content:center;text-align:center;background:linear-gradient(180deg,rgba(6,9,22,.235),rgba(6,9,22,.96))}
.rod .t{height:2.8rem;line-height:2.8rem;font-size:1.4rem;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rod .s{height:2.2rem;line-height:2.2rem;font-size:1.2rem;color:#bec3d2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rod.ep{background:rgba(10,10,10,.92);text-align:left}
.rod.ep .t{height:auto;line-height:1.35;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rod.tp{background:rgba(10,10,10,.92)}
.rod.tp .t{font-size:1.6rem}
.card.canal img{height:27.5rem;padding:4rem 4rem 10rem;background:#0c1022}
.star{display:none}
.selo{display:none;position:absolute;top:.8rem;right:.8rem;padding:.3rem .8rem;font-size:1.2rem;font-weight:bold;background:rgba(0,140,60,.9)}
.card.visto .selo{display:block}.card.visto img{opacity:.45}
.pbar{position:absolute;left:1rem;right:1rem;bottom:6.6rem;height:.4rem;border-radius:.2rem;background:rgba(60,66,90,.67)}
.pbar i{display:block;height:100%;border-radius:.2rem;background:#ff2828}
.ppct{position:absolute;right:1rem;bottom:7.2rem;font-size:1.1rem;text-shadow:0 0 .4rem #000}
/* menu lateral */
#shade{display:none;position:absolute;left:0;top:0;right:0;bottom:0;z-index:25}
#drawer{position:absolute;left:1rem;top:1rem;bottom:1rem;width:36rem;max-width:85%;box-sizing:border-box;background:rgba(6,9,22,.98);border:.1rem solid #243468;border-radius:2.2rem;z-index:30;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 1.6rem 3.2rem rgba(0,0,0,.6);-webkit-transform:translateX(-120%);transform:translateX(-120%);transition:transform .22s ease}
#drawer.on{-webkit-transform:none;transform:none}
#dhead{flex:none;height:6.8rem;box-sizing:border-box;padding:.8rem 1.4rem .8rem 2rem;display:flex;align-items:center;justify-content:space-between;font-size:2.1rem;font-weight:bold}
#dx{display:flex;align-items:center;justify-content:center;width:4.8rem;height:4.8rem;padding:0;border-radius:2.4rem;background:#0c1126;border:.1rem solid #243468;font-size:2.2rem}
#dlist{flex:1;overflow-y:auto;padding:.6rem 1.2rem 2rem 1.2rem}
.di{display:flex;align-items:center;justify-content:space-between;box-sizing:border-box;height:4.8rem;margin:0 0 .6rem;padding:0 1.6rem 0 1.8rem;border-radius:1.4rem;background:#0c1126;border:.1rem solid #243468;font-size:1.6rem;font-weight:bold;cursor:pointer;white-space:nowrap;overflow:hidden}
.di::after{content:"\203A";flex:none;margin-left:.8rem;font-size:2.6rem;line-height:1}
.di.sec{background:#2c386c}
.di.foco{border-color:#ff2828;box-shadow:inset 0 0 0 .2rem #ff2828}
/* sinopse */
#det{display:none;position:absolute;left:0;top:0;right:0;bottom:0;z-index:22;background:#000;overflow:hidden}
#detBg{position:absolute;left:0;top:0;width:100%;height:100%;background-size:cover;background-position:center;opacity:.30}
#detVeu{position:absolute;left:0;top:0;right:0;bottom:0;background:linear-gradient(90deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,.47) 100%)}
#detBox{position:absolute;left:4rem;right:4rem;top:2.8rem;bottom:2.8rem;display:flex;align-items:flex-start}
#detPoster{flex:none;width:23rem;height:34.5rem;object-fit:contain;border-radius:1.2rem;background:rgba(20,20,20,.47)}
#detInfo{flex:1;min-width:0;box-sizing:border-box;margin-left:3rem;padding:.6rem;max-height:100%;overflow-y:auto;display:flex;flex-direction:column}
#detT{font-size:3.2rem;font-weight:bold;line-height:1.2}
#detM{padding:.8rem 0 1.4rem;font-size:1.6rem;font-weight:bold;color:#ff5a5a}
#detL{padding-bottom:.6rem;font-size:1.3rem;letter-spacing:.15em;color:#aaa;font-weight:bold}
#detS{font-size:1.7rem;line-height:1.45;color:#e1e1e1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:10;-webkit-box-orient:vertical}
#detS.sem{color:#8c8c8c}
#detB{padding-top:2.6rem;display:flex}
.dbtn{display:inline-block;box-sizing:border-box;padding:1.1rem 2.5rem;border-radius:1rem;background:rgba(60,60,60,.59);border:.3rem solid transparent;font-size:1.7rem;font-weight:bold;margin-right:1.4rem;cursor:pointer;white-space:nowrap}
.dbtn.prim{background:#dc141e}
.dbtn.foco{border-color:#fff;-webkit-transform:scale(1.06);transform:scale(1.06)}
@media (orientation:portrait){
#detBox{flex-direction:column;align-items:center}
#detPoster{width:18rem;height:27rem;margin-bottom:2rem}
#detInfo{margin-left:0;width:100%}
#detT{font-size:2.6rem}
}
/* abertura */
#splash{position:absolute;left:0;top:0;right:0;bottom:0;z-index:100;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity .35s}
#splash.fim{opacity:0;pointer-events:none}
#splash .logoimg{height:75vmin;width:75vmin;max-width:90vw;object-fit:contain;animation:spEntra .5s ease both}
#splash .car{font-size:1.4rem;color:#969bb0;padding-top:.4rem;animation:spPulso .8s ease-in-out infinite alternate}
#carregando{position:absolute;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.85);font-size:1.8rem;text-align:center;padding:40vh 2rem 0;box-sizing:border-box;z-index:90}
#aviso{display:none;position:absolute;left:50%;bottom:3rem;width:30rem;max-width:90%;margin-left:-15rem;padding:1rem;text-align:center;font-size:1.2rem;box-sizing:border-box;background:rgba(20,20,20,.96);border:.15rem solid #b00000;border-radius:1.2rem;z-index:99}
@media (max-width:700px){#aviso{margin-left:-45%;left:50%}}
#player{display:none;position:fixed;left:0;top:0;width:100%;height:100%;background:#000;z-index:60;overflow:hidden}
#video{width:100%;height:100%;background:#000;object-fit:contain}
#ptitulo{position:absolute;left:0;top:0;right:0;padding:1.4rem 2.4rem;font-size:1.8rem;font-weight:bold;background:linear-gradient(180deg,rgba(0,0,0,.95),rgba(0,0,0,0));box-sizing:border-box}
#pespera{display:none;position:absolute;left:0;top:45%;width:100%;text-align:center;font-size:2rem}
#pbar{position:absolute;left:0;right:0;bottom:0;padding:3rem 2.4rem 1.6rem;box-sizing:border-box;background:linear-gradient(0deg,rgba(0,0,0,.95),rgba(0,0,0,0))}
#ptrilho{height:.6rem;background:#555;border-radius:.3rem;cursor:pointer}
#pprog{height:.6rem;width:0;background:#e00000;border-radius:.3rem}
#ptempo{margin-top:.7rem;font-size:1.3rem}
#zmenu{display:none;position:absolute;right:2.4rem;bottom:10.5rem;width:24rem;box-sizing:border-box;padding:.9rem;background:rgba(18,22,38,.97);border:.15rem solid rgba(255,255,255,.15);border-radius:1.4rem;z-index:5}
.zi{padding:.85rem 1.2rem;margin:.35rem 0;border-radius:1rem;background:rgba(255,255,255,.07);font-size:1.35rem;border:.15rem solid transparent;cursor:pointer}
.zi.on{background:rgba(224,0,0,.35);font-weight:bold}
.zi.sel{border-color:#ff3b3b}
#pctl{margin-top:.8rem}
#pctl span{display:inline-block;padding:.5rem 1.1rem;margin-right:.8rem;border-radius:1.4rem;background:rgba(255,255,255,.15);font-size:1.1rem;cursor:pointer}
#pctl span.pf{background:#e00000;box-shadow:0 0 1rem rgba(224,0,0,.8)}
#acesso{display:none;position:absolute;left:0;top:0;width:100%;height:100%;background:#05070d;z-index:200}
#acBox{width:34rem;max-width:90%;margin:16vh auto 0;text-align:center}
#acBox h2{font-size:2.4rem;margin:0 0 .6rem}
#acMsg{font-size:1.3rem;margin:0 0 1.4rem;color:#ddd;min-height:3.4rem}
#cod{width:100%;box-sizing:border-box;font-size:2rem;text-align:center;padding:.8rem;border-radius:1rem;border:.15rem solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;text-transform:uppercase;letter-spacing:.2rem;outline:none}
#cod:focus{border-color:#ff3b3b}
#cEntrar{margin:1.4rem auto 0;display:inline-block}
@keyframes spEntra{from{opacity:0;transform:translateY(.8rem)}to{opacity:1;transform:none}}
@keyframes spPulso{from{opacity:.35}to{opacity:1}}
