body:before{content:"";position:fixed;left:0;top:0;right:0;bottom:0;z-index:-2;background:var(--bg) center/cover no-repeat}
body:after{content:"";position:fixed;left:0;top:0;right:0;bottom:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.45) 60%,rgba(0,0,0,.7))}
#top{position:relative;flex:none;display:flex;align-items:flex-start;padding:1.2rem 2rem 0 2rem}
#topL{display:flex;flex-direction:column;align-items:flex-start;flex:none}
#logo{width:10.4rem;height:10.4rem;object-fit:contain;display:block;mix-blend-mode:screen}
#topM{flex:1;min-width:0;align-self:flex-end;display:flex;align-items:center;padding:0 1.5rem .4rem}
#clock{flex:none;text-align:right;padding:.8rem .6rem 0 1.4rem;text-shadow:0 2px 8px #000}
#ch{font-size:2.4rem;font-weight:bold}
#cd{font-size:1.3rem;color:#c8c8d2}
.btn{display:inline-block;padding:.6rem 1.4rem;border-radius:1.4rem;background:rgba(8,12,28,.88);border:.1rem solid #2c3e78;font-weight:bold;font-size:1.35rem;margin-right:1rem;cursor:pointer;white-space:nowrap;box-sizing:border-box}
#bMenu{width:23.5rem;height:5.8rem;margin:.6rem 0 0 0;padding:0;display:flex;align-items:center;justify-content:center;font-size:2rem}
#bCont{display:none !important}
#trilha{flex:1;font-size:1.8rem;font-weight:bold;text-shadow:0 2px 8px #000,0 0 14px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sbar{display:none;flex:1;align-items:center}
#q{flex:1;min-width:0;box-sizing:border-box;height:4.6rem;padding:0 1.2rem;font-size:1.5rem;color:#fff;background:rgba(8,12,28,.9);border:.1rem solid #2c3e78;border-radius:1.4rem;outline:none;margin-right:1rem}
#main{position:relative;flex:1;min-height:0;margin:0 2rem;padding-bottom:.8rem;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
#main::-webkit-scrollbar,#dlist::-webkit-scrollbar{display:none}
#grid{--cols:5;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));column-gap:.8rem;row-gap:1.2rem;padding:.4rem .4rem 4rem .4rem}
.sec{grid-column:1/-1;display:flex;align-items:center;padding:.8rem .8rem .2rem;font-size:1.8rem;font-weight:bold;letter-spacing:.04em;color:#fff}
.sec:before{content:"";display:block;width:.4rem;height:2.2rem;background:#ff2828;margin-right:1rem}
.sec.cinza{color:#aaa}
@media (max-width:899px){#grid{--cols:3}}
@media (max-width:599px){#grid{--cols:2}#logo{width:7.6rem;height:7.6rem}#bMenu{width:15rem;height:4.6rem;font-size:1.5rem}}
.vazio{font-size:1.5rem;padding:3rem;color:#ddd}
.card{position:relative;height:33.5rem;border-radius:1.4rem;overflow:hidden;background:rgba(8,12,28,.88);border:.1rem solid #2c3e78;box-sizing:border-box;cursor:pointer}
.card img{width:100%;height:27.5rem;object-fit:contain;display:block;background:transparent;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.card .info{position:absolute;left:0;right:0;bottom:0;height:6rem;padding:.3rem .8rem;box-sizing:border-box;text-align:center;background:linear-gradient(180deg,rgba(6,9,22,.24),rgba(6,9,22,.96))}
.card .t{font-size:1.4rem;font-weight:bold;line-height:2.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .s{font-size:1.2rem;line-height:2.2rem;color:#bec3d2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.canal img{box-sizing:border-box;padding:4rem 4rem 10rem 4rem;background:#0c1022}
.pbar{position:absolute;left:1rem;right:1rem;bottom:6.6rem;height:.4rem;border-radius:.2rem;background:rgba(60,66,90,.67)}
.pbar i{display:block;height:100%;border-radius:.2rem;background:#ff2828}
.ppct{position:absolute;right:1rem;bottom:7.2rem;font-size:1.1rem;text-shadow:0 0 4px #000}
.star{display:none}
.selo{display:none;position:absolute;top:.5rem;left:.5rem;padding:.15rem .6rem;font-size:.75rem;font-weight:bold;background:#008c3c;border-radius:.7rem}
.card.visto .selo{display:block}.card.visto img{opacity:.45}
.foco{border-color:#ff2828 !important;box-shadow:inset 0 0 0 .25rem #ff2828;z-index:5}
.btn.foco,.di.foco{box-shadow:0 0 0 .2rem #ff2828}
#shade{display:none;position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:25}
#drawer{position:absolute;left:1rem;top:1rem;bottom:1rem;width:36rem;max-width:85%;box-sizing:border-box;padding:.8rem 1rem;background:rgba(6,9,22,.98);border:.1rem solid #243468;border-radius:2.2rem;z-index:30;display:flex;flex-direction:column;-webkit-transform:translateX(-120%);transform:translateX(-120%);transition:transform .22s ease}
#drawer.on{-webkit-transform:none;transform:none}
#dhead{display:flex;align-items:center;justify-content:space-between;font-size:2.1rem;font-weight:bold;height:6.8rem;padding:0 .4rem 0 1rem}
#dx{margin:0;padding:.5rem 1.2rem;font-size:2.2rem;border-radius:1.4rem;background:#0c1126;border-color:#243468}
#dlist{flex:1;overflow-y:auto}
.di{padding:1.05rem 1.6rem;margin:.5rem 0;border-radius:2rem;background:#0c1126;font-size:1.5rem;border:.1rem solid #243468;cursor:pointer}
.di.sec{background:#2c386c;font-weight:bold}
#carregando{position:absolute;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.85);font-size:1.8rem;text-align:center;padding:40vh 2rem 0;box-sizing:border-box;z-index:90}
#aviso{display:none;position:absolute;left:50%;bottom:3rem;width:30rem;max-width:90%;margin-left:-15rem;padding:1rem;text-align:center;font-size:1.2rem;box-sizing:border-box;background:rgba(20,20,20,.96);border:.15rem solid #b00000;border-radius:1.2rem;z-index:99}
@media (max-width:700px){#aviso{margin-left:-45%;left:50%}}
#player{display:none;position:fixed;left:0;top:0;width:100%;height:100%;background:#000;z-index:60;overflow:hidden}
#video{width:100%;height:100%;background:#000;object-fit:contain}
#ptitulo{position:absolute;left:0;top:0;right:0;padding:1.4rem 2.4rem;font-size:1.8rem;font-weight:bold;background:linear-gradient(180deg,rgba(0,0,0,.95),rgba(0,0,0,0));box-sizing:border-box}
#pespera{display:none;position:absolute;left:0;top:45%;width:100%;text-align:center;font-size:2rem}
#pbar{position:absolute;left:0;right:0;bottom:0;padding:3rem 2.4rem 1.6rem;box-sizing:border-box;background:linear-gradient(0deg,rgba(0,0,0,.95),rgba(0,0,0,0))}
#ptrilho{height:.6rem;background:#555;border-radius:.3rem;cursor:pointer}
#pprog{height:.6rem;width:0;background:#e00000;border-radius:.3rem}
#ptempo{margin-top:.7rem;font-size:1.3rem}
#zmenu{display:none;position:absolute;right:2.4rem;bottom:10.5rem;width:24rem;box-sizing:border-box;padding:.9rem;background:rgba(18,22,38,.97);border:.15rem solid rgba(255,255,255,.15);border-radius:1.4rem;z-index:5}
.zi{padding:.85rem 1.2rem;margin:.35rem 0;border-radius:1rem;background:rgba(255,255,255,.07);font-size:1.35rem;border:.15rem solid transparent;cursor:pointer}
.zi.on{background:rgba(224,0,0,.35);font-weight:bold}
.zi.sel{border-color:#ff3b3b}
#pctl{margin-top:.8rem}
#pctl span{display:inline-block;padding:.5rem 1.1rem;margin-right:.8rem;border-radius:1.4rem;background:rgba(255,255,255,.15);font-size:1.1rem;cursor:pointer}
#pctl span.pf{background:#e00000;box-shadow:0 0 1rem rgba(224,0,0,.8)}
#acesso{display:none;position:absolute;left:0;top:0;width:100%;height:100%;background:#05070d;z-index:200}
#acBox{width:34rem;max-width:90%;margin:16vh auto 0;text-align:center}
#acBox h2{font-size:2.4rem;margin:0 0 .6rem}
#acMsg{font-size:1.3rem;margin:0 0 1.4rem;color:#ddd;min-height:3.4rem}
#cod{width:100%;box-sizing:border-box;font-size:2rem;text-align:center;padding:.8rem;border-radius:1rem;border:.15rem solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;text-transform:uppercase;letter-spacing:.2rem;outline:none}
#cod:focus{border-color:#ff3b3b}
#cEntrar{margin:1.4rem auto 0;display:inline-block}
#det{display:none;position:absolute;left:0;top:0;right:0;bottom:0;z-index:22;background:#05070d;overflow:hidden}
#detBg{position:absolute;left:-2%;top:-2%;width:104%;height:104%;background-size:cover;background-position:center;opacity:.32;filter:blur(.35rem)}
#detVeu{position:absolute;left:0;top:0;right:0;bottom:0;background:linear-gradient(90deg,rgba(5,7,13,.96) 0%,rgba(5,7,13,.72) 55%,rgba(5,7,13,.5) 100%)}
#detBox{position:absolute;left:4rem;right:4rem;top:3rem;bottom:3rem;display:flex;align-items:center}
#detPoster{flex:none;width:18rem;height:27rem;object-fit:cover;border-radius:1.2rem;background:#141724;box-shadow:0 1rem 3rem rgba(0,0,0,.7)}
#detInfo{flex:1;min-width:0;margin-left:3.5rem;max-height:100%;display:flex;flex-direction:column}
#detT{font-size:2.8rem;font-weight:bold;line-height:1.1;text-shadow:0 2px 10px #000}
#detM{margin-top:.8rem;font-size:1.25rem;font-weight:bold;color:#ff5a5a}
#detL{margin-top:1.5rem;font-size:.9rem;letter-spacing:.2rem;color:#9aa1b8;font-weight:bold}
#detS{margin-top:.5rem;font-size:1.3rem;line-height:1.55;color:#e4e7f1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical}
#detS.sem{color:#7d839a}
#detB{margin-top:2.2rem;display:flex}
.dbtn{display:inline-block;padding:.9rem 2.4rem;border-radius:.9rem;background:rgba(60,64,84,.85);border:.2rem solid transparent;font-size:1.35rem;font-weight:bold;margin-right:1.2rem;cursor:pointer}
.dbtn.prim{background:#dc141e}
.dbtn.foco{border-color:#fff !important;transform:scale(1.06);box-shadow:0 0 1.5rem rgba(255,255,255,.35)}
#splash{position:absolute;left:0;top:0;right:0;bottom:0;z-index:100;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity .4s}
#splash.fim{opacity:0;pointer-events:none}
#splash .logoimg{height:min(78vh,78vw);width:auto;max-width:90vw;animation:spEntra .8s ease both}
#splash .car{font-size:1.1rem;color:#969bb0;animation:spPulso 1.1s ease-in-out infinite alternate}
@keyframes spEntra{from{opacity:0;transform:translateY(.8rem)}to{opacity:1;transform:none}}
@keyframes spPulso{from{opacity:.35}to{opacity:1}}

      }, 'sec');

      if (S.exp !== ch) return;
      var cont = {}, nomes = [];
      (dados.filmes || []).forEach(function (it) {
        var c = it.categoria;
        if (!c) return;
        var k = norm(c);

      });
      lista.forEach(function (it) {
        var c = it.categoria;
        if (!c) return;
        var k = norm(c);
        if (!cont[k]) { cont[k] = { nome: c, n: 0 }; nomes.push(k); }
        cont[k].n++;
      });
      nomes.sort();

      nomes.forEach(function (k) {

      });
    }
    ['filmes', 'series', 'doramas', 'desenhos', 'animes'].forEach(function (ch) {
      secao(ch);
      if (ch === 'filmes') secaoColecoes();
    });
  }
  function abrirDrawer() {
    S.exp = S.sec;

    S.drawer = true;

    $('shade').style.display = 'block';

  function fecharDrawer() {

    $('drawer').className = '';
    $('shade').style.display = 'none';

  // ---------- voz ----------
  var recog = null, ouvindo = false;
  function voz() {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { aviso('Este aparelho não tem voz no navegador. Use o microfone do teclado ou do controle.'); $('q').focus(); return; }
    if (ouvindo && recog) { try { recog.stop(); } catch (e) {} return; }
    try {
      recog = new SR();
      recog.lang = 'pt-BR';
      recog.interimResults = true;
      recog.maxAlternatives = 1;

      recog.onresult = function (ev) {
        var t = '';
        for (var i = 0; i < ev.results.length; i++) t += ev.results[i][0].transcript;
        $('q').value = t;

        if (ev.results[ev.results.length - 1].isFinal) aviso('🔍 ' + t);
      };
      recog.onerror = function (ev) {
        var e = ev && ev.error;
        if (e === 'not-allowed' || e === 'service-not-allowed') aviso('Permita o microfone nas configurações do navegador.');
        else if (e === 'no-speech') aviso('Não ouvi nada. Toque no 🎤 e fale de novo.');
        else aviso('Não consegui ouvir. Tente de novo ou digite.');
      };
      recog.onend = function () { ouvindo = false; $('mic').style.background = ''; };
      recog.start();
    } catch (x) { ouvindo = false; aviso('Voz indisponível. Digite o nome.'); }
  }

  // ---------- aviso ----------
  function aviso(t) {
    var a = $('aviso');
    a.textContent = t; a.style.display = 'block';
    clearTimeout(timerAviso);
    timerAviso = setTimeout(function () { a.style.display = 'none'; }, 2800);
  }  // ---------- player ----------
  function fmt(s) {
    if (!isFinite(s) || s < 0) s = 0;
    s = Math.floor(s);
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
    return (h > 0 ? h + ':' + (m < 10 ? '0' : '') : '') + m + ':' + (x < 10 ? '0' : '') + x;
  }
  function mostrarBarra() {
    $('pbar').style.display = 'block'; $('ptitulo').style.display = 'block';
    clearTimeout(timerBarra);
    if (S.pc >= 0) return;
    timerBarra = setTimeout(function () { if (S.zmenu || S.pc >= 0) return; $('pbar').style.display = 'none'; $('ptitulo').style.display = 'none'; }, 4000);
  }
  var ZOOMS = [
    { n: 'Normal', s: 1, f: 'contain' },
    { n: 'Zoom 15%', s: 1.15, f: 'contain' },
    { n: 'Zoom 30% (tira as bordas)', s: 1.3, f: 'contain' },
    { n: 'Zoom 45%', s: 1.45, f: 'contain' },
    { n: 'Esticar', s: 1, f: 'fill' }
  ];
  function aplicarZoom(i) {
    var z = ZOOMS[i], v = $('video'), t = z.s === 1 ? 'none' : 'scale(' + z.s + ')';
    v.style.objectFit = z.f;
    v.style.webkitTransform = t;
    v.style.transform = t;

  }
  function desenharZoom() {
    var m = $('zmenu');
    m.innerHTML = '';
    var t = document.createElement('div');
    t.style.cssText = 'font-weight:bold;font-size:1.3rem;margin:.2rem .4rem .5rem';
    t.textContent = '⚙ Tamanho da tela';
    m.appendChild(t);
    ZOOMS.forEach(function (z, i) {
      var d = document.createElement('div');
      d.className = 'zi' + (i === S.z ? ' on' : '') + (i === S.zsel ? ' sel' : '');
      d.textContent = (i === S.z ? '✓ ' : '') + z.n;
      d.onclick = function (e) { e.stopPropagation(); escolherZoom(i); };
      m.appendChild(d);
    });
  }
  function abrirZoomMenu() {
    S.zmenu = true; S.zsel = S.z;
    desenharZoom();
    $('zmenu').style.display = 'block';
    clearTimeout(timerBarra);
    $('pbar').style.display = 'block'; $('ptitulo').style.display = 'block';
  }
  function fecharZoomMenu() {
    S.zmenu = false;
    $('zmenu').style.display = 'none';
    mostrarBarra();
  }
  function escolherZoom(i) {
    S.z = i;
    if (S.cur && S.cur.key) { var o = ler('zoom'); o[S.cur.key] = i; gravar('zoom', o); }
    aplicarZoom(i);
    fecharZoomMenu();
    aviso('⚙ ' + ZOOMS[i].n);
  }
  function tocar(titulo, url, o) {
    if (!url) { aviso('Vídeo ainda não disponível'); return; }
    o = o || {};
    if (o.pos == null && o.key) { var sv = ler('cont')[o.key]; if (sv && sv.pos) o.pos = sv.pos; }
    var v = $('video');
    S.cur = { key: o.key, titulo: titulo, url: url, capa: o.capa, ep: o.ep || null };
    S.next = acharProx(o.ep);
    S.avisouProx = false;
    limparCtl();
    $('pn').style.display = S.next ? 'inline-block' : 'none';
    aquecer(url);
    v.preload = 'auto';
    S.pos = o.pos || 0;
    var zs = ler('zoom');
    S.z = (o.key && zs[o.key]) || 0;
    aplicarZoom(S.z);
    $('ptitulo').textContent = titulo;
    $('player').style.display = 'block';
    $('pespera').style.display = 'block';
    S.player = true;
    anexar(v, url);
    try { v.play(); } catch (e) {}
    mostrarBarra();
    if (S.pos) aviso('▶ Retomando de ' + fmt(S.pos));
  }
  var hls = null;
  function anexar(v, url) {
    if (hls) { try { hls.destroy(); } catch (e) {} hls = null; }
    var eh = /\.m3u8(\?|$)/i.test(url);
    if (!eh || v.canPlayType('application/vnd.apple.mpegurl')) { v.src = url; return; }
    function usar() {
      if (window.Hls && window.Hls.isSupported()) {
        hls = new window.Hls({ maxBufferLength: 30, maxMaxBufferLength: 60, maxBufferSize: 40 * 1000 * 1000, backBufferLength: 30 });
        hls.loadSource(url); hls.attachMedia(v);
        hls.on(window.Hls.Events.MANIFEST_PARSED, function () { try { v.play(); } catch (e) {} });
      } else v.src = url;
    }
    if (window.Hls) { usar(); return; }
    var sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js';
    sc.onload = usar; sc.onerror = function () { v.src = url; };
    document.head.appendChild(sc);
  }
  function salvarProgresso(forcar) {
    var v = $('video'), now = new Date().getTime();
    if (!S.cur || !S.cur.key || v.currentTime < 15) return;
    if (!forcar && now - ultSave < 5000) return;
    ultSave = now;
    var c = ler('cont'), d = v.duration || 0;
    if (d && d - v.currentTime < 90) delete c[S.cur.key];
    else c[S.cur.key] = { titulo: S.cur.titulo, url: S.cur.url, capa: S.cur.capa, ep: S.cur.ep, pos: Math.floor(v.currentTime), dur: Math.floor(d), ts: now };
    gravar('cont', c);
  }
  function fecharPlayer() {
    var v = $('video');
    salvarProgresso(true);
    try { v.pause(); } catch (e) {}
    if (hls) { try { hls.destroy(); } catch (e) {} hls = null; }
    v.removeAttribute('src');
    try { v.load(); } catch (e) {}
    $('player').style.display = 'none';
    limparCtl(); S.next = null;
    S.zmenu = false;
    $('zmenu').style.display = 'none';
    S.player = false;
  }
  function limparCtl() {
    S.pc = -1;
    var l = $('pctl').getElementsByTagName('span');
    for (var i = 0; i < l.length; i++) l[i].className = '';
  }
  function ctrls() {
    var ids = ['pp', 'pn', 'pz', 'px'], r = [];
    for (var i = 0; i < ids.length; i++) if ($(ids[i]).style.display !== 'none') r.push($(ids[i]));
    return r;
  }
  function focoCtl(i) {
    var l = ctrls();
    limparCtl();
    if (i < 0 || !l.length) { mostrarBarra(); return; }
    S.pc = Math.min(i, l.length - 1);
    l[S.pc].className = 'pf';
    clearTimeout(timerBarra);
    $('pbar').style.display = 'block'; $('ptitulo').style.display = 'block';
  }
  function proximo(auto) {
    var n = S.next;
    if (!n) { aviso('Não há próximo episódio'); return; }
    if (!auto) salvarProgresso(true);
    aviso('⏭ ' + n.serie.titulo + ' - EP ' + n.ep.numero);
    tocarEp(n.serie, n.temp, n.ep, null);
  }
  function pular(s) {
    var v = $('video');
    try { v.currentTime = Math.max(0, Math.min(v.duration || 1e9, v.currentTime + s)); } catch (e) {}
    mostrarBarra();
  }
  function pausar() {
    var v = $('video');
    if (v.paused) v.play(); else v.pause();
    mostrarBarra();
  }
  function iniciarPlayer() {
    var v = $('video');
    v.addEventListener('timeupdate', function () {
      var d = v.duration || 0;
      $('pprog').style.width = (d ? v.currentTime / d * 100 : 0) + '%';
      $('ptempo').textContent = fmt(v.currentTime) + ' / ' + fmt(d);
      if (S.next && d && d - v.currentTime < 15 && !S.avisouProx) { S.avisouProx = true; aviso('⏭ Próximo EP começa em instantes...'); }
      salvarProgresso(false);
    });
    v.addEventListener('loadedmetadata', function () {
      if (S.pos) { try { v.currentTime = S.pos; } catch (e) {} S.pos = 0; }
    });
    v.addEventListener('playing', function () { $('pespera').style.display = 'none'; if (S.next) aquecer(S.next.ep.video); });
    v.addEventListener('canplay', function () { $('pespera').style.display = 'none'; });
    v.addEventListener('waiting', function () { $('pespera').style.display = 'block'; });
    v.addEventListener('ended', function () { if (S.next) { salvarProgresso(true); proximo(true); } else fecharPlayer(); });
    v.addEventListener('error', function () { if (S.player) aviso('Não foi possível reproduzir este vídeo'); });
    $('player').onclick = function () { if (S.zmenu) fecharZoomMenu(); else mostrarBarra(); };
    $('pp').onclick = function (e) { e.stopPropagation(); pausar(); };
    $('px').onclick = function (e) { e.stopPropagation(); fecharPlayer(); };
    $('pn').onclick = function (e) { e.stopPropagation(); proximo(false); };
    $('pz').onclick = function (e) { e.stopPropagation(); if (S.zmenu) fecharZoomMenu(); else abrirZoomMenu(); };
    $('ptrilho').onclick = function (e) {
      e.stopPropagation();
      var r = $('ptrilho').getBoundingClientRect();
      try { v.currentTime = (v.duration || 0) * ((e.clientX - r.left) / r.width); } catch (x) {}
      mostrarBarra();
    };
  }

  // ---------- assinatura (código do cliente) ----------
  // O app confere clientes/<hash do código>.json no GitHub: {"ativo": true, "ate": "2026-12-31"}.
  // Vencido, bloqueado ou inexistente = não carrega o catálogo.
  // Mude para true quando quiser exigir o código de acesso dos clientes.
  var EXIGIR_CODIGO = false;
  var DIAS_OFFLINE = 3, catalogoIniciado = false, gateAberto = false;
  function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function sha256(ascii) {
    function rr(v, a) { return (v >>> a) | (v << (32 - a)); }
    var K = [], P = [], i, j, cand = 2, comp = {};
    while (K.length < 64) {
      if (!comp[cand]) {
        for (i = 0; i < 313; i += cand) comp[i] = cand;
        K.push((Math.pow(cand, 1 / 3) * 4294967296) | 0);
        P.push((Math.pow(cand, 0.5) * 4294967296) | 0);
      }
      cand++;
    }
    var H = P.slice(0, 8), words = [], len = ascii.length * 8;
    ascii += '\x80';
    while (ascii.length % 64 - 56) ascii += '\x00';
    for (i = 0; i < ascii.length; i++) words[i >> 2] |= ascii.charCodeAt(i) << ((3 - i) % 4) * 8;
    words[words.length] = (len / 4294967296) | 0;
    words[words.length] = len | 0;
    for (j = 0; j < words.length;) {
      var w = words.slice(j, j += 16), old = H.slice(0, 8);
      H = H.slice(0, 8);
      for (i = 0; i < 64; i++) {
        var w15 = w[i - 15], w2 = w[i - 2], a = H[0], e = H[4];
        var t1 = H[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & H[5]) ^ (~e & H[6])) + K[i] +
          (w[i] = (i < 16) ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
        var t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & H[1]) ^ (a & H[2]) ^ (H[1] & H[2]));
        H = [(t1 + t2) | 0].concat(H);
        H[4] = (H[4] + t1) | 0;
        H.length = 8;
      }
      for (i = 0; i < 8; i++) H[i] = (H[i] + old[i]) | 0;
    }
    var out = '';
    for (i = 0; i < 8; i++) for (j = 3; j + 1; j--) { var b = (H[i] >> (j * 8)) & 255; out += (b < 16 ? '0' : '') + b.toString(16); }
    return out;
  }
  function normCod(c) { return String(c).toUpperCase().replace(/[^A-Z0-9]/g, ''); }
  function p2(n) { return (n < 10 ? '0' : '') + n; }
  function conferirCodigo(cod, cb) {
    if (normCod(cod).length < 4) { cb('INVALIDO'); return; }
    var x = new XMLHttpRequest(), fim = false;
    function fala(r) { if (!fim) { fim = true; cb(r); } }
    x.open('GET', BASE + 'clientes/' + sha256(normCod(cod)).substr(0, 16) + '.json?t=' + new Date().getTime(), true);
    x.timeout = 15000;
    x.onload = function () {
      if (x.status === 404) { fala('INVALIDO'); return; }
      if (x.status < 200 || x.status >= 300) { fala('SEM_INTERNET'); return; }
      var j = lerJson(x.responseText);
      if (!j) { fala('SEM_INTERNET'); return; }
      if (!j.ativo) { fala('BLOQUEADO'); return; }
      var d = new Date(), hoje = d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
      fala(j.ate && hoje > j.ate ? 'VENCIDO' : 'OK');
    };
    x.onerror = x.ontimeout = function () { fala('SEM_INTERNET'); };
    x.send();
  }
  function liberarApp() { if (!catalogoIniciado) { catalogoIniciado = true; carregar(); } }
  function pedirCodigo(msg) {
    if (S.player) fecharPlayer();
    if (S.drawer) fecharDrawer();
    gateAberto = true;
    esconderSplash(true);
    $('acMsg').textContent = msg;
    $('acesso').style.display = 'block';
    $('cod').value = lsGet('wolf_codigo');
    var o = document.querySelector('.foco');
    if (o) o.className = o.className.replace(/\s*foco/g, '');
    try { $('cod').focus(); } catch (e) {}
  }
  function fecharAcesso() { gateAberto = false; $('acesso').style.display = 'none'; try { $('cod').blur(); } catch (e) {} }
  var MSG_ACESSO = {
    VENCIDO: 'Assinatura vencida. Fale com o suporte para renovar.',
    BLOQUEADO: 'Acesso bloqueado. Fale com o suporte.',
    INVALIDO: 'Código inválido. Confira e digite de novo.',
    SEM_INTERNET: 'Sem internet. Conecte a internet para validar seu acesso.'
  };
  function verificarAssinatura() {
    liberarApp(); return;
    var cod = lsGet('wolf_codigo');
    if (!cod) { if (!gateAberto) pedirCodigo('Digite o código de acesso que você recebeu.'); return; }
    conferirCodigo(cod, function (r) {
      if (r === 'OK') lsSet('wolf_ultima_ok', String(new Date().getTime()));
      else if (r === 'SEM_INTERNET') {
        var u = parseInt(lsGet('wolf_ultima_ok') || '0', 10);
        if (new Date().getTime() - u <= DIAS_OFFLINE * 86400000) r = 'OK';
      }
      if (r === 'OK') { fecharAcesso(); liberarApp(); return; }
      pedirCodigo(MSG_ACESSO[r] || MSG_ACESSO.SEM_INTERNET);
    });
  }
  function entrarCodigo() {
    var v = $('cod').value;
    if (normCod(v).length < 4) { $('acMsg').textContent = 'Digite o código completo.'; return; }
    lsSet('wolf_codigo', v.replace(/^\s+|\s+$/g, ''));
    $('acMsg').textContent = 'Verificando...';
    verificarAssinatura();
  }
  setInterval(function () { if (!gateAberto && !S.player) verificarAssinatura(); }, 600000);

  // ---------- teclado / controle ----------
  document.addEventListener('keydown', function (e) {
    var k = e.keyCode;
    if (gateAberto) {
      var noInput = e.target && e.target.id === 'cod';
      if (k === 13) { e.preventDefault(); if (noInput && normCod($('cod').value).length < 4) return; entrarCodigo(); }
      else if (k === 40 && noInput) { e.preventDefault(); $('cod').blur(); setFoco($('cEntrar')); }
      else if (k === 38 && !noInput) { e.preventDefault(); var f = document.querySelector('.foco'); if (f) f.className = f.className.replace(/\s*foco/g, ''); $('cod').focus(); }
      return;
    }
    if (erroCarga) { if (k === 13) carregar(); return; }
    if (S.player && S.zmenu) {
      if (k === 38) { S.zsel = (S.zsel + ZOOMS.length - 1) % ZOOMS.length; desenharZoom(); }
      else if (k === 40) { S.zsel = (S.zsel + 1) % ZOOMS.length; desenharZoom(); }
      else if (k === 13) escolherZoom(S.zsel);
      else if (k === 461 || k === 27 || k === 8 || k === 405 || k === 90) fecharZoomMenu();
      else return;
      e.preventDefault();
      return;
    }
    if (S.player) {
      if (S.pc >= 0 && (k === 37 || k === 39 || k === 13 || k === 38)) {
        var cl = ctrls();
        if (k === 37) focoCtl(Math.max(0, S.pc - 1));
        else if (k === 39) focoCtl(Math.min(cl.length - 1, S.pc + 1));
        else if (k === 13) cl[S.pc].onclick({ stopPropagation: function () {} });
        else { limparCtl(); mostrarBarra(); }
        e.preventDefault();
        return;
      }
      if ((k === 427 || k === 34 || k === 78) && S.next) proximo(false);
      else if (k === 13 || k === 415 || k === 19 || k === 179) pausar();
      else if (k === 37) pular(-10);
      else if (k === 39) pular(10);
      else if (k === 412) pular(-30);
      else if (k === 417) pular(30);
      else if (k === 38 || k === 405 || k === 90) abrirZoomMenu();
      else if (k === 40) { mostrarBarra(); focoCtl(0); }
      else if (k === 461 || k === 27 || k === 8 || k === 413) fecharPlayer();
      else return;
      e.preventDefault();
      return;
    }
    if (e.target && e.target.tagName === 'INPUT') {
      if (k === 13 || k === 38 || k === 40) {
        e.preventDefault(); e.target.blur();
        if (k === 38) mover('u'); else focusCard(0);
      } else if (k === 461 || k === 27) { e.preventDefault(); e.target.blur(); }
      return;
    }
    if (k === 37) mover('l');
    else if (k === 38) mover('u');
    else if (k === 39) mover('r');
    else if (k === 40) mover('d');
    else if (k === 13) ativar();
    else if (k === 405 || k === 70) { var c = document.querySelector('.foco'); if (c && c.className.indexOf('card') > -1) favoritar(c); }
    else if (k === 461 || k === 27 || k === 8) { if (!voltar()) return; }
    else return;
    e.preventDefault();
  }, false);

  // ---------- início ----------
  function iniciar() {
    ajustar();
    window.addEventListener('resize', ajustar, false);
    $('bMenu').onclick = abrirDrawer;
    $('bCont').onclick = abrirCont;
    $('bCont').onmouseenter = function () { setFoco($('bCont')); };
    $('bMenu').onmouseenter = function () { setFoco($('bMenu')); };
    $('dx').onclick = function () { fecharDrawer(); setFoco($('bMenu')); };
    $('dx').onmouseenter = function () { setFoco($('dx')); };
    $('shade').onclick = function () { fecharDrawer(); };
    $('carregando').onclick = function () { if (erroCarga) carregar(); };
    $('cEntrar').onclick = entrarCodigo;
    $('cEntrar').onmouseenter = function () { setFoco($('cEntrar')); };
    $('q').oninput = buscar;
    $('mic').onclick = voz;
    $('mic').onmouseenter = function () { setFoco($('mic')); };
    var lg = document.querySelector('#splash .logoimg');
    if (lg) $('logo').src = lg.src;
    relogio(); setInterval(relogio, 15000);
    iniciarPlayer();
    verificarAssinatura();  // só carrega o catálogo se o código estiver válido
  }
  iniciar();
})();
