name: Build WOLF webOS IPK

on:
  workflow_dispatch:
  push:
    paths:
      - "WOLF-webOS/**"
      - ".github/workflows/build-webos-ipk.yml"

jobs:
  build-ipk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar webOS CLI
        run: |
          npm install -g @webos-tools/cli

      - name: Criar ícone do aplicativo
        run: |
          python3 -m pip install Pillow

          python3 <<'PY'
          from PIL import Image, ImageDraw

          size = 192

          img = Image.new("RGBA", (size, size), (12, 12, 16, 255))
          draw = ImageDraw.Draw(img)

          margin = 12

          draw.rounded_rectangle(
              (margin, margin, size - margin, size - margin),
              radius=30,
              fill=(190, 20, 40, 255)
          )

          points = [
              (42, 62),
              (67, 82),
              (82, 52),
              (96, 80),
              (110, 52),
              (125, 82),
              (150, 62),
              (134, 134),
              (96, 112),
              (58, 134)
          ]

          draw.polygon(points, fill=(255, 255, 255, 255))

          img.save("WOLF-webOS/icon.png", "PNG")

          print("icon.png criado com sucesso.")
          PY

          echo "=== ICON ==="
          ls -lh WOLF-webOS/icon.png

      - name: Corrigir appinfo.json
        run: |
          python3 <<'PY'
          import json

          path = "WOLF-webOS/appinfo.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          data["icon"] = "icon.png"
          data["main"] = "Index.html"
          data["requiredACG"] = []

          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print("appinfo.json corrigido.")
          PY

          echo "=== APPINFO ==="
          cat WOLF-webOS/appinfo.json

      - name: Verificar arquivos do aplicativo
        run: |
          echo "=== WOLF-webOS ==="
          find WOLF-webOS -maxdepth 2 -type f -print

          echo "=== INDEX ==="
          test -f "WOLF-webOS/Index.html"

          echo "=== ICON ==="
          test -f "WOLF-webOS/icon.png"

          echo "=== APPINFO ==="
          test -f "WOLF-webOS/appinfo.json"

      - name: Verificar aplicativo webOS
        run: |
          ares-package --check WOLF-webOS

      - name: Gerar IPK
        run: |
          mkdir -p dist
          ares-package -o dist WOLF-webOS

      - name: Conferir IPK
        run: |
          echo "=== ARQUIVOS GERADOS ==="
          ls -lah dist

      - name: Disponibilizar IPK
        uses: actions/upload-artifact@v4
        with:
          name: WOLF-webOS-IPK
          path: "dist/*.ipk"
          if-no-files-found: error
          retention-days: 30
