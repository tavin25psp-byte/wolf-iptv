#bg::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(5,7,18,.38),rgba(4,6,16,.62),rgba(2,3,10,.92))}
#app{position:fixed;inset:0;display:flex;padding:10px 14px 10px 12px;--cols:5}
#side{display:flex;flex-shrink:0}
#menu{overflow-y:auto;scrollbar-width:none;padding:2px 10px 8px 4px;display:flex;flex-direction:column;align-items:center}
#menu::-webkit-scrollbar{display:none}
.logo{width:76px;height:76px;margin-bottom:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;letter-spacing:2px;color:#ff2828;text-shadow:0 0 14px rgba(255,40,40,.6)}
.logo img{width:100%;height:100%;object-fit:contain}
.mi{width:190px;height:40px;margin-bottom:4px;border-radius:10px;border:1px solid transparent;background:transparent;text-align:left;padding:0 10px 0 16px;font-size:14px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:12px}
.mi .ic{width:22px;text-align:center}
.mi:hover,.mi:focus-visible{background:rgba(255,255,255,.24);border-color:#ff2828;outline:none}
.mi.on{font-weight:700;background:linear-gradient(90deg,#d7141e,#780a14);border-color:rgba(255,90,90,.8)}
.vline{width:2px;background:linear-gradient(transparent,#e61923,transparent)}
#main{flex:1;min-width:0;display:flex;flex-direction:column;padding-left:14px}
#top{display:flex;align-items:center;gap:10px;padding-bottom:10px}
#back{display:none;flex-shrink:0}
.rb{width:42px;height:42px;border-radius:50%;flex-shrink:0;background:rgba(18,22,45,.75);border:1px solid #465078;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.rb:hover,.rb:focus-visible{border:2px solid #ff2828;outline:none}
#q{flex:1;min-width:0;height:42px;border-radius:22px;padding:0 18px;background:rgba(14,18,38,.7);border:1px solid #2c3764;outline:none;font-size:14px;margin-right:4px}
#q::placeholder{color:#aaafc3}
#q:focus{border:2px solid #ff2828}
#clock{text-align:right;line-height:1.15;padding:0 4px}
#hora{font-size:20px;font-weight:700}
#data{font-size:11px;color:#b4b9c8}
#content{flex:1;overflow-y:auto;scrollbar-width:none;padding-bottom:30px}
#content::-webkit-scrollbar{display:none}
.stitle{display:flex;align-items:center;padding:12px 8px 8px 4px;font-size:18px;font-weight:700}
.stitle i{width:4px;height:22px;background:#ff2828;margin-right:10px}
.stitle .more{margin-left:auto;font-size:13px;font-weight:400;background:none;border:2px solid transparent;border-radius:16px;padding:6px 12px;cursor:pointer}
.stitle .more:hover,.stitle .more:focus-visible{background:rgba(255,255,255,.35);border-color:#ff2828;outline:none}
.banner{position:relative;height:250px;border-radius:14px;overflow:hidden;background:#0a0c19;margin-bottom:8px}
.banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.8}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,6,14,.98),rgba(5,6,14,.75),rgba(5,6,14,.12))}
.binfo{position:absolute;z-index:1;left:0;top:0;bottom:0;width:50%;padding:16px 16px 16px 26px;display:flex;flex-direction:column;justify-content:center}
.tag{align-self:flex-start;background:#c8191e;border-radius:12px;padding:4px 14px 4px 12px;font-size:11px;font-weight:700;margin-bottom:8px}
.btitle{font-size:30px;font-weight:700;margin:0;line-height:1.15;text-shadow:0 2px 6px #000;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;gap:8px;padding:8px 0;flex-wrap:nowrap;overflow:hidden}
.chip{background:rgba(20,26,50,.4);border:1px solid rgba(200,205,225,.55);border-radius:12px;padding:2px 8px;font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips.big .chip{font-size:12px;padding:4px 12px}
.bsin{font-size:13px;color:#d7dceb;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.acts{display:flex;gap:12px;padding-top:12px;flex-wrap:wrap}
.pill{border-radius:24px;padding:10px 22px;font-size:14px;font-weight:700;cursor:pointer;background:rgba(20,26,50,.6);border:1px solid rgba(200,205,225,.6)}
.pill.red{background:#dc141e;border-color:#dc141e}
.pill:hover,.pill:focus-visible{border:3px solid #fff;padding:8px 20px;outline:none}
.row,.grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:6px 8px;padding:0 4px}
.row{margin-bottom:6px}
.grid{gap:16px 12px}
.card{position:relative;border-radius:10px;overflow:hidden;background:rgba(8,12,28,.88);border:1px solid #243264;cursor:pointer;min-width:0}
.card:hover,.card:focus-visible{border:3px solid #ff2828;outline:none;background:rgba(14,20,42,.96)}
.card.l{height:130px}
.card.g{height:260px}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card.g img{height:210px;bottom:auto;background:#0c1022}
.card.g img.logo-img{object-fit:contain;padding:14px}
.card .shade{position:absolute;inset:0;background:linear-gradient(transparent,rgba(0,0,0,.43),rgba(4,6,14,.94))}
.card .inf{position:absolute;left:0;right:0;bottom:0;padding:4px 10px 8px}
.card .inf b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 4px #000;margin-bottom:4px}
.card .inf .chips{padding:0}
.card .foot{position:absolute;left:0;right:0;bottom:0;height:50px;padding:4px 8px;text-align:center;background:linear-gradient(rgba(6,9,22,.16),rgba(6,9,22,.94));display:flex;flex-direction:column;justify-content:center}
.card .foot b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:22px}
.card .foot span{font-size:11px;color:#afb4c8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:18px}
.card .foot.ep b{white-space:normal;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .emo{position:absolute;left:0;right:0;top:0;height:210px;display:flex;align-items:center;justify-content:center;font-size:52px;background:linear-gradient(135deg,#1e2450,#0c1022)}
.card .seen{position:absolute;top:6px;right:6px;background:#00963c;border-radius:6px;padding:2px 6px;font-size:11px;font-weight:700}
.card .bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(60,66,90,.67)}
.card .bar i{display:block;height:100%;background:#ff2828}
.sbox{margin:0 6px 12px;height:50px;width:calc(100% - 12px);border-radius:10px;background:#12162c;border:1px solid #3c4264;padding:0 16px;font-size:16px;outline:none}
.sbox:focus{border:3px solid #fff}
.empty{text-align:center;font-size:18px;padding:40px 20px;white-space:pre-line}
#splash{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .35s}
#splash .logo{width:min(60vw,60vh);height:min(60vw,60vh);font-size:12vmin}
#splash p{color:#969baf;font-size:14px;animation:pl .8s infinite alternate}
@keyframes pl{from{opacity:.35}to{opacity:1}}
.ov{position:fixed;inset:0;z-index:30;background:#000;overflow-y:auto}
.ov .bgimg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;opacity:.3}
.ov::before{content:"";position:fixed;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.92),rgba(0,0,0,.47));z-index:0}
.det{position:relative;z-index:1;display:flex;gap:32px;padding:28px 40px;max-width:1100px;margin:0 auto}
.det .poster{width:220px;height:330px;flex-shrink:0;border-radius:12px;object-fit:contain;background:rgba(20,20,20,.47)}
.det h2{font-size:30px;margin:0}
.det .meta{color:#ff5a5a;font-weight:700;font-size:15px;padding:6px 0 12px}
.det .lb{color:#aaa;font-size:12px;letter-spacing:.15em;font-weight:700}
.det p{color:#dcdcdc;font-size:16px;line-height:1.5;margin:4px 0}
.dbt{margin-top:24px;display:flex;gap:12px;flex-wrap:wrap}
.db{border:0;border-radius:8px;padding:12px 24px;font-size:16px;font-weight:700;background:rgba(60,60,60,.6);cursor:pointer}
.db.red{background:#dc141e}
.db:hover,.db:focus-visible{outline:3px solid #fff}
#player{background:#000;z-index:40;display:flex;flex-direction:column;overflow:hidden}
#player::before{display:none}
#pbar{display:flex;align-items:center;gap:12px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
#pbar b{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pbar a{color:#ff5a5a;font-size:13px}
#vid{flex:1;min-height:0;width:100%;background:#000}
#perr{color:#ff9a9a;text-align:center;padding:8px;font-size:14px;display:none}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:rgba(30,30,40,.95);border:1px solid #465078;border-radius:20px;padding:10px 20px;font-size:14px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
@media(max-width:899px){#app{--cols:3}}
@media(max-width:599px){
#app{--cols:2;padding:8px 10px 8px 6px}
.mi{width:48px;padding:0;justify-content:center;font-size:16px}.mi .lb{display:none}
.logo{width:44px;height:44px;font-size:11px;letter-spacing:0}
#main{padding-left:8px}
.banner{height:220px}.binfo{width:92%;padding-left:18px}.btitle{font-size:20px}.pill{font-size:12px;padding:8px 16px}
#clock #data{display:none}.rb{width:38px;height:38px}
.det{flex-direction:column;align-items:center;padding:20px}.det .poster{width:160px;height:240px}.det h2{font-size:24px}
.card.g{height:230px}.card.g img,.card .emo{height:180px}
}
.lg{position:fixed;inset:0;z-index:70;background:#000;display:flex;align-items:center;justify-content:center;padding:20px}
.lgb{width:min(340px,100%);display:flex;flex-direction:column;gap:12px;text-align:center}
.lgb h2{margin:0 0 8px;color:#ff2828;letter-spacing:3px;text-shadow:0 0 14px rgba(255,40,40,.6)}
.lgb input{height:48px;border-radius:10px;background:#12162c;border:1px solid #3c4264;padding:0 16px;font-size:16px;outline:none}
.lgb input:focus{border:2px solid #ff2828}
.lgb .db{height:48px}
.lgm{min-height:20px;color:#ff9a9a;font-size:14px;white-space:pre-line}
.lgb textarea{border-radius:10px;background:#12162c;border:1px solid #3c4264;color:#fff;padding:10px;font:13px monospace;resize:none}
</style>
</head>

<div id="bg"></div>
<div id="app">
  <div id="side"><div id="menu"></div><div class="vline"></div></div>
  <div id="main">
    <div id="top">
      <button class="rb" id="back" title="Voltar">‹</button>

    </div>
    <div id="content"></div>
  </div>
</div>

  d.append(bt);ov.append(d);document.body.append(ov)}

/* ---------- login / assinatura ---------- */
async function hashCli(u,sn){const e=new TextEncoder(),k=await crypto.subtle.importKey('raw',e.encode(norm(u)+':'+sn),'PBKDF2',false,['deriveBits']);
  const b=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:e.encode('wolf-iptv'),iterations:100000},k,64);return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function checar(k){try{const r=await fetch(BASE+'clientes/'+k+'.json?t='+Date.now(),{cache:'no-store'});
  if(r.status===404)return{msg:'Usuário ou senha incorretos'};if(!r.ok)throw 0;
  const j=JSON.parse(await r.text()),agora=Date.parse(r.headers.get('date'))||Date.now();
  if(!(j.ativo===true||j.ativo==='true'))return{msg:'Acesso suspenso.\nFale com o suporte.'};
  const m=String(j.ate||'').match(/(\d{2})\/(\d{2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/),fim=m?Date.UTC(+m[3],m[2]-1,+m[1],(m[4]?+m[4]:23)+3,m[5]?+m[5]:59):9e15;
  if(agora>fim)return{msg:'Seu acesso venceu em '+new Date(fim).toLocaleDateString('pt-BR',{timeZone:'America/Sao_Paulo'})+'.\nFaça o pagamento para renovar.'};
  return{ok:1,fim}}catch{return{net:1}}}
function sair(m){sv('sessao',null);sv('msgLogin',m||'');location.reload()}
function telaLogin(msg){return new Promise(res=>{const o=h('div','lg'),f=h('div','lgb'),u=h('input'),sn=h('input'),b=h('button','db red','Entrar'),m=h('div','lgm',msg||'');
  u.placeholder='Usuário';u.autocapitalize='none';u.autocomplete='username';sn.type='password';sn.placeholder='Senha';sn.autocomplete='current-password';
  u.onkeydown=e=>{if(e.key==='Enter')sn.focus()};sn.onkeydown=e=>{if(e.key==='Enter')b.click()};
  b.onclick=async()=>{if(!u.value.trim()||!sn.value){m.textContent='Digite usuário e senha';return}
    b.disabled=true;m.textContent='Verificando…';let k;
    try{k=await hashCli(u.value,sn.value)}catch{m.textContent='Navegador sem suporte (use https).';b.disabled=false;return}
    const r=await checar(k);if(r.ok){sv('sessao',{h:k,fim:r.fim});o.remove();res()}else{m.textContent=r.net?'Sem conexão. Tente de novo.':r.msg;b.disabled=false}};
  f.append(h('h2','','WOLF IPTV'),u,sn,b,m);o.append(f);document.body.append(o)})}
async function acesso(){const S=ls('sessao',null),msg=ls('msgLogin','');sv('msgLogin','');
  if(S&&S.h){const r=await checar(S.h);if(r.ok){sv('sessao',{h:S.h,fim:r.fim});return}if(r.net&&S.fim>Date.now())return;sv('sessao',null);return telaLogin(r.msg||msg)}
  return telaLogin(msg)}
async function vigiar(){const S=ls('sessao',null);if(!S)return;const r=await checar(S.h);
  if(r.net){if(!(S.fim>Date.now()))sair('Seu acesso venceu.');return}if(!r.ok)sair(r.msg);else sv('sessao',{h:S.h,fim:r.fim})}
function painelAdmin(){const o=h('div','lg'),f=h('div','lgb'),u=h('input'),sn=h('input'),d=h('input'),b=h('button','db red','Gerar'),n=h('textarea'),c=h('textarea'),x=h('button','db','Fechar'),i=h('div','lgm','');
  u.placeholder='Usuário';u.autocapitalize='none';sn.placeholder='Senha';d.type='number';d.value=30;d.placeholder='Dias de acesso';n.readOnly=c.readOnly=true;n.rows=2;c.rows=2;n.placeholder='Nome do arquivo';c.placeholder='Conteúdo';
  b.onclick=async()=>{if(!u.value.trim()||!sn.value){i.textContent='Preencha usuário e senha';return}
    const fim=new Date(Date.now()+(+d.value||30)*864e5).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo',hourCycle:'h23'}).replace(',','').slice(0,16);
    n.value='clientes/'+await hashCli(u.value,sn.value)+'.json';c.value=JSON.stringify({ativo:true,ate:fim});i.textContent='Crie esse arquivo no GitHub (toque nos campos para copiar).\nBloquear: troque true por false. Renovar: mude a data.'};
  [n,c].forEach(t=>t.onclick=()=>{t.select();navigator.clipboard&&navigator.clipboard.writeText(t.value)});x.onclick=()=>o.remove();
  o.style.zIndex=80;f.append(h('h2','','Novo cliente'),u,sn,d,b,n,c,i,x);o.append(f);document.body.append(o)}
if(location.hash==='#admin')painelAdmin();
const t0=Date.now();
function fimSplash(){const s=$('#splash'),w=Math.max(0,1800-(Date.now()-t0));setTimeout(()=>{s.style.opacity=0;setTimeout(()=>s.remove(),350)},w)}
acesso().then(()=>carregar()).then(()=>{nav(inicio);fimSplash();setInterval(vigiar,12e4);document.addEventListener('visibilitychange',()=>{if(!document.hidden)vigiar()})}).catch(e=>{C.append(h('div','empty','ERRO NO CATÁLOGO\n\n'+e.message));fimSplash()});
