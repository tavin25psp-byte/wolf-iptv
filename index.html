        <h1>WOLF IPTV</h1>
    </div>
    
    <div class="player-container">
        <video id="videoPlayer" controls playsinline></video>
    </div>

    <div class="section-title">Canais ao Vivo</div>
    <div id="listaCanais" class="grid"><div class="loading">A carregar canais...</div></div>

    <div class="section-title">Filmes</div>
    <div id="listaFilmes" class="grid"><div class="loading">A carregar filmes...</div></div>

    <script>
        const video = document.getElementById('videoPlayer');

        function playStream(url) {
            if (!url) {
                alert('Link de vídeo inválido.');
                return;
            }
            if (Hls.isSupported() && url.includes('.m3u8')) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else if (video.canPlayType('application/vnd.apple.mpegurl') || !url.includes('.m3u8')) {
                video.src = url;
                video.play().catch(e => console.log("Erro ao reproduzir:", e));
            } else {
                alert('O seu navegador não suporta este formato de vídeo.');
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Carregar Canais
        fetch('./canais.json')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('listaCanais');
                container.innerHTML = '';
                const lista = Array.isArray(data) ? data : (data.canais || data.channels || []);
                if (lista.length === 0) {
                    container.innerHTML = '<div class="loading">Nenhum canal encontrado.</div>';
                    return;
                }
                lista.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => playStream(item.url || item.link);
                    const logo = item.logo || 'https://via.placeholder.com/130x160?text=Canal';
                    const nome = item.nome || item.name || 'Canal';
                    card.innerHTML = `<img src="${logo}" alt="${nome}" onerror="this.src='https://via.placeholder.com/130x160?text=Canal'"><p>${nome}</p>`;
                    container.appendChild(card);
                });
            }).catch(() => document.getElementById('listaCanais').innerHTML = '<div class="loading">Erro ao carregar canais.json</div>');

        // Carregar Filmes (Lendo filmes.json)
        fetch('./filmes.json')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('listaFilmes');
                container.innerHTML = '';
                const lista = Array.isArray(data) ? data : (data.filmes || []);
                if (lista.length === 0) {
                    container.innerHTML = '<div class="loading">Nenhum filme encontrado.</div>';
                    return;
                }
                lista.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => playStream(item.url || item.video || item.link);
                    const capa = item.capa || item.poster || 'https://via.placeholder.com/130x160?text=Filme';
                    const nome = item.titulo || item.name || 'Filme';
                    card.innerHTML = `<img src="${capa}" alt="${nome}" onerror="this.src='https://via.placeholder.com/130x160?text=Filme'"><p>${nome}</p>`;
                    container.appendChild(card);
                });
            }).catch(() => document.getElementById('listaFilmes').innerHTML = '<div class="loading">Erro ao carregar filmes.json</div>');
    </script>
</body>
</html>
