<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Wolf IPTV</title>
<style>
:root{--red:#eb1e28;--bg:#050305;--card:#120a0d;--txt:#f2f2f4;--mut:#a9a9b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font:15px -apple-system,system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:linear-gradient(#000,#000d);backdrop-filter:blur(8px);padding:calc(8px + env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid #3a0b10}
.brand{font-weight:800;font-style:italic;font-size:20px}.brand b{color:var(--red)}
#q{width:100%;margin-top:8px;padding:11px 16px;border-radius:22px;border:1px solid #aa1923;background:#060406;color:var(--txt);font-size:16px}
nav{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;padding:8px 14px;border-radius:18px;border:1px solid #5a1118;background:#0b0507;color:var(--txt);font-size:14px}
nav button.on{background:linear-gradient(90deg,#eb191e,#960a12);border-color:#ff5a5a;font-weight:700}
main{padding:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px}
.card{background:var(--card);border-radius:10px;overflow:hidden;border:1px solid #2a0d12;cursor:pointer}
.card .img{aspect-ratio:2/3;background:#1a1013 center/cover no-repeat}
.card .t{padding:6px 7px;font-size:12px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.row{display:flex;align-items:center;gap:10px;padding:10px;background:var(--card);border:1px solid #2a0d12;border-radius:10px;margin-bottom:8px}
.row img{width:42px;height:42px;object-fit:contain;border-radius:8px;background:#000}
.mut{color:var(--mut)}.empty{text-align:center;color:var(--mut);padding:40px 10px}
#more{display:block;margin:16px auto;padding:10px 22px;border-radius:20px;border:1px solid var(--red);background:none;color:var(--txt)}
dialog{border:0;padding:0;background:#0c0507;color:var(--txt);width:min(720px,100%);max-height:92vh;border-radius:16px;overflow:auto}
dialog::backdrop{background:#000c}
.dlg{padding:16px}
.dlg h2{margin:0 0 6px;font-size:18px}
.x{float:right;background:none;border:0;color:var(--txt);font-size:26px;line-height:1}
video{width:100%;max-height:60vh;background:#000;border-radius:10px;margin-top:8px}
.btn{display:inline-block;margin:6px 6px 0 0;padding:9px 16px;border-radius:18px;border:1px solid var(--red);background:#1b0609;color:var(--txt);font-size:14px;text-decoration:none}
.btn.p{background:linear-gradient(90deg,#eb191e,#96140f)}
.eps{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.eps button{text-align:left;padding:11px 12px;border-radius:10px;border:1px solid #2a0d12;background:var(--card);color:var(--txt);font-size:14px}
select{padding:9px;border-radius:10px;background:#120a0d;color:var(--txt);border:1px solid #5a1118;font-size:15px;margin-top:8px}
#gate{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
#gate input{width:100%;max-width:320px;padding:13px;border-radius:12px;border:1px solid #aa1923;background:#060406;color:var(--txt);font-size:18px;text-align:center;text-transform:uppercase}
#gmsg{color:#ff7a7a;min-height:20px}
.hide{display:none!important}
.fav.on{background:linear-gradient(90deg,#1a8fe0,#0d4f9a);border-color:#6cc4ff}
.eps .ep{display:flex;gap:6px}.eps .ep button[data-e]{flex:1}
.eps .ep .fav{flex:none;width:48px;text-align:center;padding:0;opacity:.45}.eps .ep .fav.on{opacity:1}
.row .mid{flex:1;min-width:0}.row .mid div:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm{flex:none;background:none;border:0;color:var(--mut);font-size:22px;padding:6px 10px}
</style>
</head>
<body>

<div id="gate" class="hide">
  <div class="brand" style="font-size:30px">WOLF <b>IPTV</b></div>
  <div class="mut">Digite seu código de acesso</div>
  <input id="code" autocomplete="off" autocapitalize="characters" placeholder="CÓDIGO">
  <button class="btn p" id="gok">Entrar</button>
  <div id="gmsg"></div>
</div>

<header>
  <div class="brand">WOLF <b>IPTV</b></div>
  <input id="q" type="search" placeholder="🔍  Buscar filmes, séries, doramas...">
  <nav id="nav"></nav>
</header>
<main id="main"></main>

<dialog id="dlg"><div class="dlg" id="dbody"></div></dialog>

<script>
/* ============ CONFIGURAÇÃO ============ */
const BASE = "https://raw.githubusercontent.com/tavin25psp-byte/wolf-iptv/main/";
const EXIGIR_CODIGO = true;      // mesma regra do app: clientes/<hash>.json com {"ativo":true,"ate":"AAAA-MM-DD"}
const PAGINA = 60;

const ARQ = {
  series:  ["series.json","serie.json","s%C3%A9rie.json"],
  doramas: ["doramas.json","Doramas.json"],
  novelas: ["novelas.json","novela.json","Novelas.json","Novela.json"],
  animes:  ["animes.json","anime.json","Animes.json","Anime.json"],
  desenhos:["desenho.json","desenhos.json","Desenho.json","Desenhos.json"],
  rangers: ["rangers.json","Rangers.json","ranger.json","Ranger.json"],
  metal:   ["metal.json","Metal.json"],
  sentai:  ["sentai.json","Sentai.json"],
};
const ABAS = [
  ["filmes","🎬 Filmes"],["geladeira","🧊 Geladeira"],["series","📺 Séries"],["doramas","🌸 Doramas"],["novelas","💕 Novelas"],
  ["animes","🍥 Anime"],["canais","📡 Canais"],["desenhos","🧸 Desenhos"],
  ["rangers","🦸 Rangers"],["metal","🤖 Metal"],["sentai","⚡ Sentai"]
];

/* ============ UTIL ============ */
const $ = s => document.querySelector(s);
const norm = t => (t||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// iOS bloqueia http dentro de página https (conteúdo misto). Tenta subir para https.
const seguro = u => (u||"").trim().replace(/^http:\/\//i,"https://");
const store = { get(k){try{return localStorage.getItem(k)}catch{return null}}, set(k,v){try{localStorage.setItem(k,v)}catch{}} };

/* ============ GELADEIRA (guardar pra depois) ============ */
const REG = {};
const gel = () => { try{ return JSON.parse(store.get("geladeira")||"[]"); }catch{ return []; } };
const gelTem = id => gel().some(x=>x.id===id);
function gelToggle(item){
  let l = gel();
  if(l.some(x=>x.id===item.id)) l = l.filter(x=>x.id!==item.id); else l.unshift(item);
  store.set("geladeira",JSON.stringify(l));
}
function favBtn(item,mini){
  REG[item.id]=item; const on=gelTem(item.id);
  return `<button class="${mini?"":"btn "}fav ${on?"on":""}" data-fid="${esc(item.id)}" data-mini="${mini?1:0}" onclick="favClick(event,this)">${mini?"🧊":(on?"🧊 Na geladeira":"🧊 Guardar")}</button>`;
}
function favClick(ev,b){
  ev.stopPropagation(); const item=REG[b.dataset.fid]; if(!item) return;
  gelToggle(item); const on=gelTem(item.id);
  b.classList.toggle("on",on);
  if(b.dataset.mini!=="1") b.textContent = on?"🧊 Na geladeira":"🧊 Guardar";
}
const itFilme = f => ({id:"f|"+f.titulo+"|"+f.video,tipo:"filme",titulo:f.titulo,capa:f.capa,video:f.video,categoria:f.categoria,sinopse:f.sinopse});

async function baixar(nome){
  try{
    const r = await fetch(BASE+nome+"?t="+Date.now(),{cache:"no-store"});
    if(!r.ok) return null;
    return JSON.parse((await r.text()).trim());
  }catch{ return null; }
}
async function primeiro(lista){
  for(const n of lista){ const j = await baixar(n); if(j) return j; }
  return null;
}
function arr(j,chave){
  if(!j) return [];
  if(Array.isArray(j)) return j;
  if(Array.isArray(j[chave])) return j[chave];
  for(const k in j) if(Array.isArray(j[k])) return j[k];
  return [];
}
function lerSeries(lista){
  return lista.map(o=>({
    titulo:o.titulo||"", capa:o.capa||"", categoria:o.categoria||"", sinopse:o.sinopse||o.descricao||"",
    temporadas:(o.temporadas||[]).map((t,i)=>({
      numero:t.numero??i+1,
      episodios:(t.episodios||[]).map((e,j)=>({numero:e.numero??j+1,titulo:e.titulo||"",video:e.video||""}))
    }))
  })).filter(s=>s.titulo);
}
function lerFilmes(lista){
  return lista.map(o=>({titulo:o.titulo||"",capa:o.capa||"",video:o.video||"",categoria:o.categoria||"",sinopse:o.sinopse||o.descricao||""}))
              .filter(f=>f.titulo&&f.video);
}

/* ============ ACESSO (código) ============ */
async function hash16(codigo){
  const c = codigo.toUpperCase().replace(/[^A-Z0-9]/g,"");
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(c));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("").slice(0,16);
}
async function conferir(codigo){
  if(codigo.replace(/[^A-Za-z0-9]/g,"").length<4) return "Código inválido.";
  try{
    const r = await fetch(BASE+"clientes/"+await hash16(codigo)+".json?t="+Date.now(),{cache:"no-store"});
    if(r.status===404) return "Código inválido.";
    if(!r.ok) return "Sem conexão. Tente de novo.";
    const j = await r.json();
    if(!j.ativo) return "Código bloqueado.";
    const ate = j.ate||"";
    if(ate){
      if(ate.length>10){ if(new Date()>new Date(ate)) return "Código vencido."; }
      else if(new Date().toISOString().slice(0,10)>ate) return "Código vencido.";
    }
    return null;
  }catch{ return "Sem conexão. Tente de novo."; }
}
async function entrar(){
  if(!EXIGIR_CODIGO) return iniciar();
  const salvo = store.get("codigo");
  if(salvo){ const e = await conferir(salvo); if(!e) return iniciar(); $("#gmsg").textContent=e; }
  $("#gate").classList.remove("hide");
}
$("#gok").onclick = async ()=>{
  const c = $("#code").value; $("#gmsg").textContent="Verificando...";
  const e = await conferir(c);
  if(e){ $("#gmsg").textContent=e; return; }
  store.set("codigo",c); $("#gate").classList.add("hide"); iniciar();
};

/* ============ DADOS ============ */
const D = {filmes:[],series:[],doramas:[],novelas:[],animes:[],desenhos:[],rangers:[],metal:[],sentai:[],canais:[]};
let aba="filmes", filtro="", limite=PAGINA;

async function iniciar(){
  $("#main").innerHTML='<div class="empty">Carregando catálogo...</div>';
  const [cat,can,...resto] = await Promise.all([
    baixar("catalogo.json"), baixar("canais.json"),
    ...Object.keys(ARQ).map(k=>primeiro(ARQ[k]))
  ]);
  if(cat){ D.filmes = lerFilmes(arr(cat,"filmes")); }
  const ks = Object.keys(ARQ);
  ks.forEach((k,i)=>{
    const j = resto[i]; let lista = arr(j,k);
    if(!lista.length && cat && Array.isArray(cat[k])) lista = cat[k];
    if(["desenhos","rangers","metal","sentai"].includes(k)){
      // arquivos mistos: itens com "temporadas" são séries, os demais são filmes
      const s = lista.filter(o=>o.temporadas), f = lista.filter(o=>!o.temporadas);
      D[k] = [...lerFilmes(f), ...lerSeries(s)];
    } else D[k] = lerSeries(lista);
  });
  D.canais = arr(can,"canais").map(o=>({nome:(o.nome||o.name||"").trim(),url:(o.url||o.link||"").trim(),logo:o.logo||"",categoria:o.categoria||"Canais ao vivo"})).filter(c=>c.nome&&c.url);
  desenharNav(); desenhar();
}

/* ============ TELA ============ */
function desenharNav(){
  $("#nav").innerHTML = ABAS.map(([k,n])=>`<button data-k="${k}" class="${k===aba?"on":""}">${n}</button>`).join("");
  $("#nav").onclick = e=>{ const b=e.target.closest("button"); if(!b) return; aba=b.dataset.k; limite=PAGINA; desenharNav(); desenhar(); scrollTo(0,0); };
}
$("#q").oninput = e=>{ filtro=norm(e.target.value); limite=PAGINA; desenhar(); };

function desenharGeladeira(){
  const m = $("#main");
  const l = gel().filter(x=>!filtro||norm(x.titulo||x.nome).includes(filtro));
  if(!l.length){ m.onclick=null; m.innerHTML='<div class="empty">🧊 A geladeira está vazia.<br>Toque em “Guardar” num filme, série, episódio ou canal.</div>'; return; }
  const sub = x => x.tipo==="filme" ? "🎬 Filme" : x.tipo==="serie" ? "📺 Série" : x.tipo==="canal" ? "📡 Canal ao vivo" : "▶ T"+x.temp+" · Ep "+x.num+(x.etitulo?" · "+x.etitulo:"");
  m.innerHTML = l.map((x,i)=>{
    const img = x.capa||x.logo;
    return `<div class="row" data-g="${i}">${img?`<img loading="lazy" src="${esc(seguro(img))}" alt="">`:"<div style='width:42px;text-align:center'>🧊</div>"}<div class="mid"><div>${esc(x.titulo||x.nome)}</div><div class="mut" style="font-size:12px">${esc(sub(x))}</div></div><button class="rm" data-rm="${i}" aria-label="Remover">✕</button></div>`;
  }).join("");
  m.onclick = e=>{
    const rm=e.target.closest("[data-rm]");
    if(rm){ gelToggle(l[+rm.dataset.rm]); desenhar(); return; }
    const r=e.target.closest("[data-g]"); if(!r) return;
    const x=l[+r.dataset.g];
    if(x.tipo==="filme") abrirFilme(x);
    else if(x.tipo==="canal") tocar(x.nome,x.url);
    else if(x.tipo==="ep") tocar(x.titulo+" — T"+x.temp+" Ep "+x.num,x.video);
    else { const s=(D[x.aba]||[]).find(y=>y.titulo===x.titulo&&y.temporadas); s ? abrirSerie(s,x.aba) : alert("Série não encontrada no catálogo."); }
  };
}

function desenhar(){
  const m = $("#main");
  if(aba==="geladeira") return desenharGeladeira();
  if(aba==="canais"){
    const l = D.canais.filter(c=>!filtro||norm(c.nome).includes(filtro));
    m.innerHTML = l.length ? l.slice(0,limite).map((c,i)=>`<div class="row" data-c="${i}">${c.logo?`<img loading="lazy" src="${esc(seguro(c.logo))}" alt="">`:"<div style='width:42px'>📡</div>"}<div><div>${esc(c.nome)}</div><div class="mut" style="font-size:12px">${esc(c.categoria)}</div></div><div style="margin-left:auto">${favBtn({id:"c|"+c.url,tipo:"canal",nome:c.nome,url:c.url,logo:c.logo},true)}</div></div>`).join("") : '<div class="empty">Nenhum canal.</div>';
    m.onclick = e=>{ const r=e.target.closest("[data-c]"); if(r) tocar(l[+r.dataset.c].nome,l[+r.dataset.c].url); };
    return;
  }
  const todos = D[aba].filter(x=>!filtro||norm(x.titulo).includes(filtro));
  if(!todos.length){ m.innerHTML='<div class="empty">Nada encontrado.</div>'; return; }
  const vis = todos.slice(0,limite);
  m.innerHTML = `<div class="grid">${vis.map((x,i)=>`<div class="card" data-i="${i}"><div class="img" style="background-image:url('${esc(seguro(x.capa))}')"></div><div class="t">${esc(x.titulo)}</div></div>`).join("")}</div>`
    + (todos.length>limite?'<button id="more">Carregar mais</button>':"");
  m.onclick = e=>{
    if(e.target.id==="more"){ limite+=PAGINA; desenhar(); return; }
    const c=e.target.closest("[data-i]"); if(!c) return;
    const x=vis[+c.dataset.i]; x.temporadas ? abrirSerie(x) : abrirFilme(x);
  };
}

/* ============ PLAYER / DETALHES ============ */
const dlg=$("#dlg"), body=$("#dbody");
dlg.addEventListener("close",()=>{ const v=body.querySelector("video"); if(v){v.pause();v.removeAttribute("src");v.load();} body.innerHTML=""; if(aba==="geladeira") desenhar(); });
dlg.addEventListener("click",e=>{ if(e.target===dlg) dlg.close(); });
const fechar='<button class="x" onclick="dlg.close()" aria-label="Fechar">×</button>';

function playerHTML(url,nome){
  const u = seguro(url);
  const salvar = /\.m3u8/i.test(u) ? "" : `<div class="salvar"><button class="btn p" data-url="${esc(u)}" data-nome="${esc(nome||"video")}" onclick="salvarVideo(this)">⬇ Salvar no celular</button><div class="sst mut" style="font-size:13px;margin-top:6px"></div></div>`;
  return `<video id="vid" controls playsinline webkit-playsinline autoplay preload="metadata" data-orig="${esc((url||"").trim())}" src="${esc(u)}"></video>
  <div id="verr" class="mut" style="font-size:13px;margin-top:6px"></div>
  <a class="btn" href="${esc(u)}" target="_blank" rel="noopener">Abrir link direto</a>${salvar}`;
}
async function salvarVideo(btn){
  const box=btn.parentElement, st=box.querySelector(".sst");
  if(box._file) return compartilhar(box._file,st);
  const url=btn.dataset.url, nome=(btn.dataset.nome||"video").replace(/[\\\/:*?"<>|]/g,"").trim()||"video";
  btn.disabled=true; st.textContent="Baixando... 0%";
  try{
    const r=await fetch(url); if(!r.ok) throw new Error("HTTP "+r.status);
    const total=+r.headers.get("content-length")||0, rd=r.body.getReader(), parts=[]; let got=0;
    for(;;){ const {done,value}=await rd.read(); if(done) break; parts.push(value); got+=value.length;
      st.textContent="Baixando... "+(total?Math.round(got/total*100)+"%":(got/1048576).toFixed(0)+" MB"); }
    const ext=(url.split("?")[0].match(/\.([a-z0-9]{2,4})$/i)||[])[1]||"mp4";
    let tipo=r.headers.get("content-type")||""; if(!tipo.startsWith("video")) tipo="video/mp4";
    box._file=new File(parts,nome+"."+ext,{type:tipo});
    btn.disabled=false;
    if(/Android/i.test(navigator.userAgent)){
      baixarArquivo(box._file); btn.textContent="⬇ Baixar de novo";
      st.textContent="✅ Baixado. Procure em Downloads (ou na Galeria, álbum Downloads).";
    } else {
      btn.textContent="✅ Pronto — toque para salvar";
      st.textContent="No menu que abrir, escolha “Salvar vídeo”.";
    }
  }catch(e){
    btn.disabled=false;
    const msg=String(e&&e.message||e); const motivo=/HTTP (\d+)/.test(msg)?"o servidor recusou ("+msg+")":/Failed to fetch|NetworkError|Load failed/i.test(msg)?"o servidor não permite baixar por dentro do app (bloqueio CORS) ou a conexão caiu":"erro: "+msg;
    st.innerHTML="Não baixou: "+motivo+".<br><a class='btn' href='"+esc(url)+"' download='"+esc(nome)+"' target='_blank' rel='noopener'>Tentar download direto</a> <span class='mut'>(se abrir o player, toque em ⋮ › Baixar)</span>";
  }
}
function baixarArquivo(file){
  const a=document.createElement("a"); a.href=URL.createObjectURL(file); a.download=file.name;
  document.body.appendChild(a); a.click(); a.remove();
}
function compartilhar(file,st){
  if(navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).then(()=>{st.textContent="Pronto ✔";}).catch(err=>{ if(err.name!=="AbortError") st.textContent="Não consegui abrir o menu de compartilhar."; });
  } else {
    const a=document.createElement("a"); a.href=URL.createObjectURL(file); a.download=file.name;
    document.body.appendChild(a); a.click(); a.remove(); st.textContent="Baixado — veja em Arquivos/Downloads.";
  }
}
function ligarErro(){
  const v=body.querySelector("video"); if(!v) return;
  v.addEventListener("error",()=>{
    const orig=(v.getAttribute("src")||"");
    const ext=(orig.split("?")[0].match(/\.([a-z0-9]{2,4})$/i)||[])[1]||"?";
    const cod=v.error?v.error.code:"?";
    const motivo={1:"cancelado",2:"erro de rede/servidor recusou",3:"erro ao decodificar",4:"formato ou link não suportado"}[cod]||"desconhecido";
    $("#verr").innerHTML="Não tocou ("+motivo+"). Extensão: <b>."+esc(ext)+"</b> · código "+cod+".<br>Link: <span style='word-break:break-all'>"+esc(orig)+"</span>";
  });
}
function tocar(titulo,url){
  body.innerHTML = `<div class="dlg">${fechar}<h2>${esc(titulo)}</h2>${playerHTML(url,titulo)}</div>`;
  if(!dlg.open) dlg.showModal(); ligarErro();
  body.querySelector("video").play().catch(()=>{});
}
function abrirFilme(f){
  body.innerHTML = `<div class="dlg">${fechar}<h2>${esc(f.titulo)}</h2><div class="mut" style="font-size:13px">${esc(f.categoria)}</div>
    <p>${esc(f.sinopse)}</p>${favBtn(itFilme(f))}${playerHTML(f.video,f.titulo)}</div>`;
  dlg.showModal(); ligarErro();
}
function abrirSerie(s,origem){
  origem = origem||aba;
  const salva = +store.get("t_"+s.titulo)||0;
  body.innerHTML = `<div class="dlg">${fechar}<h2>${esc(s.titulo)}</h2><p class="mut">${esc(s.sinopse)}</p>
    ${favBtn({id:"s|"+origem+"|"+s.titulo,tipo:"serie",aba:origem,titulo:s.titulo,capa:s.capa})}
    <div id="pl"></div>
    <select id="sel">${s.temporadas.map((t,i)=>`<option value="${i}" ${i===salva?"selected":""}>Temporada ${t.numero}</option>`).join("")}</select>
    <div class="eps" id="eps"></div></div>`;
  const lista = ()=>{
    const t=s.temporadas[+$("#sel").value]; store.set("t_"+s.titulo,$("#sel").value);
    $("#eps").innerHTML = t.episodios.map((e,i)=>`<div class="ep"><button data-e="${i}">${e.numero}. ${esc(e.titulo||"Episódio "+e.numero)}</button>${favBtn({id:"e|"+s.titulo+"|"+t.numero+"|"+e.numero,tipo:"ep",titulo:s.titulo,temp:t.numero,num:e.numero,etitulo:e.titulo,video:e.video,capa:s.capa},true)}</div>`).join("");
    $("#eps").onclick = ev=>{
      const b=ev.target.closest("[data-e]"); if(!b) return;
      const e=t.episodios[+b.dataset.e];
      $("#pl").innerHTML = playerHTML(e.video,s.titulo+" T"+t.numero+"E"+e.numero); ligarErro();
      $("#pl video").play().catch(()=>{}); $("#pl").scrollIntoView({behavior:"smooth",block:"nearest"});
    };
  };
  dlg.showModal();
  $("#sel").addEventListener("change",lista); lista();
}

entrar();
</script>
</body>
</html>
