<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wolf IPTV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #121212; color: #ffffff; font-family: Arial, sans-serif; padding: 20px; }
        h1 { text-align: center; margin-bottom: 20px; color: #00e676; }
        .player-container { max-width: 800px; margin: 0 auto 30px auto; background: #000; border-radius: 8px; overflow: hidden; }
        video { width: 100%; height: auto; display: block; }
        .section-title { margin: 20px 0 10px 0; border-bottom: 2px solid #00e676; padding-bottom: 5px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
        .card { background: #1e1e1e; padding: 10px; border-radius: 8px; text-align: center; cursor: pointer; }
        .card img { width: 100%; height: 100px; object-fit: contain; margin-bottom: 8px; }
        .card p { font-size: 14px; word-break: break-word; }
    </style>
</head>
<body>
    <h1>Wolf IPTV</h1>
    <div class="player-container">
        <video id="videoPlayer" controls autoplay></video>
    </div>
    <h2 class="section-title">Canais</h2>
    <div id="listaCanais" class="grid">Carregando canais...</div>
    <h2 class="section-title">Catálogo</h2>
    <div id="listaCatalogo" class="grid">Carregando catálogo...</div>

    <script>
        const video = document.getElementById('videoPlayer');
        function playStream(url) {
            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', () => video.play());
            } else {
                alert('Navegador não suporta a reprodução.');
            }
        }
        fetch('./canais.json')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('listaCanais');
                container.innerHTML = '';
                data.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => playStream(item.url || item.link);
                    const logo = item.logo || item.icon || 'https://via.placeholder.com/100?text=Canal';
                    const nome = item.nome || item.name || 'Canal';
                    card.innerHTML = `<img src="${logo}" alt="${nome}"><p>${nome}</p>`;
                    container.appendChild(card);
                });
            }).catch(() => document.getElementById('listaCanais').innerText = 'Erro ao carregar canais.');

        fetch('./catalogo.json')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('listaCatalogo');
                container.innerHTML = '';
                data.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => playStream(item.url || item.link);
                    const logo = item.logo || item.poster || 'https://via.placeholder.com/100?text=Filme';
                    const nome = item.nome || item.title || 'Filme/Série';
                    card.innerHTML = `<img src="${logo}" alt="${nome}"><p>${nome}</p>`;
                    container.appendChild(card);
                });
            }).catch(() => document.getElementById('listaCatalogo').innerText = 'Erro ao carregar catálogo.');
    </script>
</body>
</html>
